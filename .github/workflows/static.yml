# Test, build and deploy the static demo to GitHub Pages.
# Pages cannot run server.js, so this is `npm run build:static`: the whole engine
# runs in the visitor's browser (web/src/lib/local-api.ts), uploads and appeals
# stay in their localStorage, and the LLM grader is off.
name: Deploy static demo to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel one that is already running.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Engine checks
        run: npm test
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static demo
        run: npm run build:static
        env:
          # "/<repo>/" on a project site, "/" on a custom domain
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
